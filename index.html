  <style>
    @font-face { font-family: "Bricolage"; src: url("fonts/display.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
    /* The opening, in four movements. One: the lower ring draws itself in light. Two: a small ring is born in the centre of
       the big one and rises through it, smoothly, to become the upper half of the 8. Three: the 8 stands alone with a line
       that says eight is not the goal, and words rain the whole height of the screen and pool at the bottom. Four: every
       word flies to one place and becomes the .5, which is inked out of them and lights up with a mirror shine; the line of
       encouragement arrives. Then the screen folds into the dot. Inline so it is the very first thing painted. */
    #splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #0B1120; color: #F4F1E8; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation;
      clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); transition: clip-path .75s cubic-bezier(.7, 0, .25, 1), opacity .5s; }
    #splash.out { clip-path: circle(0% at var(--x, 50%) var(--y, 50%)); }
    /* the very first open: only the quiet ink and glow, until the welcome takes over */
    #splash.first .stage, #splash.first .bar, #splash.first .hint, #splash.first canvas.rain { display: none; }
    #splash .glow { position: absolute; inset: -30%; pointer-events: none; opacity: .9;
      background: radial-gradient(42% 38% at 30% 35%, rgba(43, 79, 208, .55), transparent 65%), radial-gradient(38% 34% at 72% 62%, rgba(62, 207, 200, .40), transparent 65%), radial-gradient(30% 28% at 55% 20%, rgba(229, 180, 80, .22), transparent 65%);
      animation: sp-aurora 9s ease-in-out infinite alternate; }
    #splash .ikat { position: absolute; inset: -20%; width: 140%; height: 140%; opacity: .11; mix-blend-mode: screen; animation: sp-drift 40s linear infinite alternate; -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000 20%, transparent 100%); mask-image: radial-gradient(60% 60% at 50% 50%, #000 20%, transparent 100%); }
    #splash canvas.rain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
    #splash .stage { position: relative; z-index: 2; display: grid; justify-items: center; gap: 26px; padding: 24px; width: min(86vw, 440px); }
    #splash svg.mark { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 18px rgba(62, 207, 200, .35)) drop-shadow(0 0 2px rgba(255, 255, 255, .25)); animation: sp-breathe 3.6s ease-in-out 8.8s infinite; }
    #splash .s, #splash .gl, #splash .shine { fill: none; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    #splash .s { stroke: url(#sp-g); }
    /* one: the lower ring draws itself; the stroke is parked beyond the path's end, so not even a round cap shows early */
    #splash .s2 { stroke-dasharray: 1 1.3; stroke-dashoffset: 1.15; opacity: 0; animation: sp-draw .9s cubic-bezier(.55, 0, .15, 1) .15s forwards; }
    /* two: the small ring is born at the heart of the big one, grows there, and rises through it into its place on top */
    #splash .topg { transform-box: view-box; transform-origin: 72px 50px; transform: translateY(70px) scale(0); opacity: 0; animation: sp-birth 1.8s cubic-bezier(.2, .8, .2, 1) 1s forwards; }
    /* the whole mark sits centred while it is only an 8, then slides left to make room for the .5 */
    #splash .markg { transform-box: view-box; transform: translateX(88px); animation: sp-slide .8s cubic-bezier(.6, 0, .2, 1) 5.35s forwards; }
    /* four: once the words have gathered, the dot and the five are inked out of them, then a mirror shine runs along the five */
    #splash .dot { fill: #E5B450; filter: drop-shadow(0 0 10px rgba(229, 180, 80, .8)); }
    #splash .dotg { transform-box: view-box; transform-origin: 135px 152px; transform: scale(0); opacity: 0; animation: sp-ink .7s cubic-bezier(.2, .8, .3, 1) 7.35s forwards; }
    #splash .s3 { opacity: 0; transform-box: view-box; transform-origin: 217px 90px; transform: scale(1.04); animation: sp-ink .8s cubic-bezier(.2, .8, .3, 1) 7.4s forwards; }
    #splash .gl { stroke: #fff; stroke-dasharray: .07 1; stroke-dashoffset: 1.07; opacity: 0; animation: sp-glint 6.5s cubic-bezier(.4, 0, .2, 1) 8.8s infinite; }
    #splash .shine { stroke: #fff; stroke-width: 13; stroke-dasharray: .34 1; stroke-dashoffset: 1.34; opacity: 0; animation: sp-shine 1.5s cubic-bezier(.3, 0, .2, 1) 8.1s forwards; }
    #splash.out .dotg { animation: sp-flare .7s ease-in forwards; }
    /* the words: first the line that says eight is not enough, then the line of encouragement, in the same place */
    #splash .lines { display: grid; justify-items: center; width: 100%; }
    #splash .lines > p { grid-area: 1 / 1; margin: 0; text-align: center; font: 500 clamp(17px, 4.6vw, 21px)/1.35 "Bricolage", "Segoe UI", system-ui, sans-serif; color: #C9D1E3; letter-spacing: -0.005em; opacity: 0; transform: translateY(10px); max-width: 34ch; }
    #splash .lines b { color: #fff; font-weight: 600; }
    #splash #sp-eight { animation: sp-rise .8s cubic-bezier(.2, .7, .2, 1) 2.9s forwards, sp-fade .5s ease 6.9s forwards; }
    #splash #sp-line { animation: sp-rise .9s cubic-bezier(.2, .7, .2, 1) 8.1s forwards; }
    #splash .bar { position: absolute; bottom: max(34px, env(safe-area-inset-bottom)); left: 50%; width: 120px; height: 2px; margin-left: -60px; border-radius: 2px; background: rgba(255, 255, 255, .12); overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #8FAEFF, #3ECFC8, #E5B450); transform: scaleX(0); transform-origin: left; animation: sp-fill 8.8s cubic-bezier(.3, .6, .3, 1) .2s forwards; }
    #splash.out .bar i { transform: scaleX(1); transition: transform .25s; }
    #splash .hint { position: absolute; bottom: max(14px, calc(env(safe-area-inset-bottom) - 2px)); left: 0; right: 0; text-align: center; font: 500 11px/1 "Bricolage", "Segoe UI", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(201, 209, 227, .45); opacity: 0; animation: sp-rise 1s ease 3.2s forwards; }
    @keyframes sp-draw { from { stroke-dashoffset: 1.15; opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
    /* the birth: a point of light at the heart of the big ring swells into a small ring, breathes once, then rises through the
       ring's wall and settles on top with the softest overshoot; every segment eases, nothing snaps */
    @keyframes sp-birth {
      0% { transform: translateY(70px) scale(0); opacity: 0; animation-timing-function: cubic-bezier(.2, .6, .3, 1); }
      18% { transform: translateY(70px) scale(.5); opacity: 1; animation-timing-function: cubic-bezier(.4, 0, .6, 1); }
      30% { transform: translateY(68px) scale(.44); animation-timing-function: cubic-bezier(.5, 0, .1, 1); }
      76% { transform: translateY(-5px) scale(.98); animation-timing-function: cubic-bezier(.3, 0, .4, 1); }
      90% { transform: translateY(2px) scale(1.01); animation-timing-function: cubic-bezier(.3, 0, .3, 1); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes sp-slide { to { transform: translateX(0); } }
    @keyframes sp-ink { from { opacity: 0; } 60% { opacity: 1; } to { opacity: 1; transform: scale(1); } }
    @keyframes sp-shine { 0% { opacity: 0; stroke-dashoffset: 1.34; } 10% { opacity: .9; } 80% { opacity: .9; stroke-dashoffset: -.34; } 100% { opacity: 0; stroke-dashoffset: -.34; } }
    @keyframes sp-glint { 0% { opacity: 0; stroke-dashoffset: 1.07; } 4% { opacity: .95; } 30% { opacity: .95; stroke-dashoffset: -.07; } 31%, 100% { opacity: 0; stroke-dashoffset: -.07; } }
    @keyframes sp-flare { to { transform: scale(2.6); opacity: 0; } }
    @keyframes sp-rise { to { opacity: 1; transform: none; } }
    @keyframes sp-fade { to { opacity: 0; transform: translateY(-8px); } }
    @keyframes sp-fill { to { transform: scaleX(.86); } }
    @keyframes sp-breathe { 50% { transform: scale(1.025); filter: drop-shadow(0 0 26px rgba(62, 207, 200, .5)) drop-shadow(0 0 2px rgba(255, 255, 255, .35)); } }
    @keyframes sp-aurora { to { transform: translate3d(4%, -3%, 0) rotate(3deg) scale(1.08); } }
    @keyframes sp-drift { to { transform: translate3d(-4%, 3%, 0); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .s2 { stroke-dashoffset: 0; opacity: 1; animation: none; } #splash .gl, #splash .shine, #splash canvas.rain { display: none; } #splash .glow, #splash .ikat { animation: none; }
      #splash .topg, #splash .markg, #splash .dotg, #splash .s3 { transform: none; opacity: 1; animation: none; } #splash svg.mark { animation: none; }
      #splash #sp-eight { display: none; } #splash #sp-line, #splash .hint { animation: sp-rise .4s ease forwards; }
      #splash { transition: opacity .4s; } #splash.out { clip-path: none; opacity: 0; }
    }
  </style>

  <script>
    // The opening's words. Two lines, chosen by the day and the hour: one for the 8 alone, one for the 8.5.
    // And the rain: words that fall while the screen says 8, then gather into the .5, so the half point is made of them.
    (function () {
      var S = window.__splash = { start: Date.now(), skip: false, first: false };
      var kv = {}; try { kv = JSON.parse(localStorage.getItem("eight-kv") || "{}"); } catch (e) {}
      // a brand-new device gets the welcome instead ("This was made for you.", her name); the opening plays from the second visit on
      if (!kv.welcomed && !/[?&]nowelcome\b/.test(location.search)) { S.first = true; document.getElementById("splash").classList.add("first"); return; }
      var name = (kv.name || "").trim();
      var eights = [
        "Eight is good. It is not the goal.", "Most people stop at eight.", "Eight. Close. Not there.", "Eight is a fine number. It is not yours.",
        "Eight opens the door. Eight point five walks in.", "Good enough is where it ends for most. Not here.", "Eight is the room. You want the window seat."
      ];
      var lines = [
        "One more step to the goal.", "Every word you keep is a point.", "Band 8.5 is a habit, not a day.", "Small, daily, done.", "You are closer than yesterday.",
        "Fluency is only familiarity.", "Read something. Say something. Keep something.", "The hard part was opening this. Done.", "Ten minutes now is an hour later.",
        "Mistakes are the lesson, not the verdict.", "Listening is the cheapest band to raise.", "Speak before you feel ready.", "Your English is better than your nerves say.",
        "One deck, one day, one band at a time.", "The test is 2 hours 45 minutes. Today is 15.", "Three good habits in a row make an 8.5.", "Nobody is watching. Practise anyway.",
        "Accuracy is attention, and attention is free.", "The next word is the only one that matters.", "Back again. That is the whole secret."
      ];
      var d = new Date(), n = (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) + Math.floor(d.getHours() / 8);
      document.getElementById("sp-eight").textContent = eights[n % eights.length];
      var text = lines[n % lines.length], el = document.getElementById("sp-line");
      if (name && n % 3 === 0) { var b = document.createElement("b"); b.textContent = name + ", "; el.appendChild(b); el.appendChild(document.createTextNode(text.charAt(0).toLowerCase() + text.slice(1))); }
      else el.textContent = text;
      document.getElementById("splash").addEventListener("pointerdown", function () { if (Date.now() - S.start > 1200) S.skip = true; });

      // ---- the rain of words, and what they become ----
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var WORDS = [
        "consistency", "momentum", "discipline", "focus", "rhythm", "patience", "craft", "curiosity", "precision", "nuance", "fluency", "clarity", "stamina", "calm",
        "courage", "repetition", "attention", "accuracy", "range", "cohesion", "lexis", "collocations", "paraphrase", "intonation", "pacing", "a breath", "listening",
        "noticing", "again", "once more", "small steps", "daily", "steady", "early mornings", "sharp", "lucid", "vivid", "deliberate", "resilient", "poise", "showing up",
        "the long game", "compounding", "a streak", "practice", "progress", "grace", "timing", "structure", "evidence", "examples", "detail", "register", "tone",
        "confidence", "quiet hours", "second drafts", "feedback", "good questions", "rereading", "notebooks", "margins", "flashcards", "nights that end on time",
        "built different", "understood the assignment", "main character energy", "it's giving fluent", "no cap", "unbothered", "on a roll", "aura", "glow-up",
        "lowkey consistent", "highkey ready", "W habits", "valid", "real", "era: 8.5", "core memory", "rent-free vocabulary", "vibe check: passed", "slay, quietly",
        "delulu with a plan", "soft launch: new accent", "ate that essay", "touch grass, then read"
      ];
      var cv = document.getElementById("sp-rain"), cx = cv.getContext("2d"), W = 0, H = 0, dpr = 1;
      function size() { dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0); }

      var RAIN = 2900, SPAWN_END = 5800, GATHER = 6300, FLY = 1000, SETTLE = 7550, END = 8100;
      var drops = [], lastSpawn = 0, targets = null, gatherAt = 0, seed = 7, deck = [];
      function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
      function nextWord() { if (!deck.length) { deck = WORDS.slice(); for (var i = deck.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp; } } return deck.pop(); }   // every word once before any repeats
      var COLS = [[143, 174, 255], [62, 207, 200], [229, 180, 80]];

      function spawn(t) {

      }
      // where the words go: points along the five and around the dot, in screen pixels, read from the drawn mark itself
      function readTargets() {
        var five = document.getElementById("sp-five"), dot = document.getElementById("sp-dot"), pts = [];
        var m = five.getScreenCTM(), L = five.getTotalLength(), svg = document.getElementById("sp-mark"), p = svg.createSVGPoint();
        for (var i = 0; i < 84; i++) {

      }

        cx.clearRect(0, 0, W, H);

        if (t >= GATHER && !targets) { try { targets = readTargets(); } catch (e) { targets = []; } gatherAt = t; for (var j = 0; j < drops.length; j++) { var dr = drops[j], tg = targets[(j * 7) % Math.max(1, targets.length)] || [W / 2, H / 2, .5]; dr.tx = tg[0]; dr.ty = tg[1]; dr.tc = colourAt(tg[2]); dr.ta = tg[3] || 0; dr.sx = dr.x; dr.sy = dr.y; dr.delay = rnd() * 300; dr.bend = (rnd() - .5) * 140; } }
        cx.textAlign = "center"; cx.textBaseline = "middle";
        for (var i = drops.length - 1; i >= 0; i--) {
          var w = drops[i], x, y, a, size, col = w.col;
          if (!targets) {
            // it falls the whole height and comes to rest near the bottom, so the screen fills from the floor up; nothing is lost
            var age = (t - w.born) / 1000;
            y = w.y + w.vy * age;
            if (y >= w.floor) { if (w.restAge == null) w.restAge = age; y = w.floor; age = w.restAge; }
            x = w.x + Math.sin(w.ph + age * 1.6) * w.sway; a = w.a * Math.min(1, age * 2.2); size = w.size;
            w.x2 = x; w.y2 = y;

      var began = Date.now();

        var v = document.getElementById("view");
