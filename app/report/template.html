<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8.5 progress report</title>
<style>
/*FONTS*/
:root {
  --bg: #F5F3EE; --surface: #FFFFFF; --surface-2: #ECE9E1; --line: #D8D4C8;
  --text: #17202E; --text-2: #465063; --text-3: #5F6A7E;
  --accent: #1E3FA8; --accent-ink: #fff; --accent-soft: #E1E8FB; --turq: #0A726E; --turq-soft: #D4EFEC;
  --danger: #B42318; --danger-soft: #FBE4E1; --ok: #137A4B; --ok-soft: #DDF1E7; --warn: #8F5A00; --warn-soft: #F8EAD0;
  --p-task: #2650C8; --p-article: #0A726E; --p-collocation: #8F5A00; --p-grammar: #A3336B; --p-template: #566074;
  --sk-speak: #0A726E; --sk-write: #1E3FA8; --sk-read: #8F5A00; --sk-listen: #6B4FB0;
  --f-display: "Bricolage", "Segoe UI", system-ui, sans-serif; --f-text: "Instrument", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #131B2E; --surface-2: #1B2540; --line: #27324E;
  --text: #E8ECF5; --text-2: #B4BDD0; --text-3: #8F9AB2;
  --accent: #8FAEFF; --accent-ink: #0B1120; --accent-soft: #1B2850; --turq: #3ECFC8; --turq-soft: #123A3E;
  --danger: #FF8A7A; --danger-soft: #3A1B1B; --ok: #5FD39B; --ok-soft: #12301F; --warn: #E5B450; --warn-soft: #382B10;
  --p-task: #8FAEFF; --p-article: #4FD6CF; --p-collocation: #E5B450; --p-grammar: #F08DBB; --p-template: #A8B1C4;
  --sk-speak: #3ECFC8; --sk-write: #8FAEFF; --sk-read: #E5B450; --sk-listen: #B7A8F0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1120; --surface: #131B2E; --surface-2: #1B2540; --line: #27324E;
  --text: #E8ECF5; --text-2: #B4BDD0; --text-3: #8F9AB2;
  --accent: #8FAEFF; --accent-ink: #0B1120; --accent-soft: #1B2850; --turq: #3ECFC8; --turq-soft: #123A3E;
  --danger: #FF8A7A; --danger-soft: #3A1B1B; --ok: #5FD39B; --ok-soft: #12301F; --warn: #E5B450; --warn-soft: #382B10;
  --p-task: #8FAEFF; --p-article: #4FD6CF; --p-collocation: #E5B450; --p-grammar: #F08DBB; --p-template: #A8B1C4;
  --sk-speak: #3ECFC8; --sk-write: #8FAEFF; --sk-read: #E5B450; --sk-listen: #B7A8F0;
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--f-text); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 64px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
h2 { font-size: 20px; margin-bottom: 4px; }
h3 { font-size: 15px; margin: 18px 0 8px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); } .tiny { font-size: 12.5px; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }

/* masthead */
.mast { background: #0B1120; color: #F4F1E8; position: relative; overflow: hidden; }
.mast svg.ikat { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; }
.mast .in { position: relative; max-width: 1120px; margin: 0 auto; padding: 28px 20px 30px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
.brand { font: 600 44px/1 var(--f-display); letter-spacing: -0.04em; color: #8FAEFF; }
.mast h1 { font-size: 28px; margin-top: 8px; color: #F4F1E8; }
.mast .sub { color: #B4BDD0; margin-top: 4px; }
.mast .right { text-align: right; color: #B4BDD0; font-size: 14px; }
.mast .toggle { margin-top: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #F4F1E8; border-radius: 10px; min-height: 36px; padding: 0 12px; }

section { margin-top: 34px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 860px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3, .g2 { grid-template-columns: 1fr; } }

/* hero */
.hero { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 28px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.bigband { font: 600 clamp(96px, 16vw, 148px)/.85 var(--f-display); letter-spacing: -0.045em; color: var(--accent); font-variant-numeric: tabular-nums; }
.gap { font: 600 22px var(--f-display); margin-top: 10px; }
.skillrow { display: grid; grid-template-columns: 92px 1fr 90px; gap: 12px; align-items: center; padding: 7px 0; }
.skillrow.hb { grid-template-columns: 150px 1fr 120px; }
@media (max-width: 600px) { .skillrow.hb { grid-template-columns: 1fr auto; gap: 4px 10px; } .skillrow.hb .track { grid-column: 1 / -1; order: 3; } .cell .lg { display: none; } .cell .sm { display: inline !important; } .cell { min-height: 62px; } }
.cell .sm { display: none; }
.track { position: relative; height: 10px; background: var(--surface-2); border-radius: 10px; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 10px; }
.track .base { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-3); }
.track .aim { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--text); border-radius: 2px; }
.delta { font-weight: 600; } .delta.up { color: var(--ok); } .delta.down { color: var(--danger); }

/* KPI tiles */
.kpi .v { font: 600 34px/1.05 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text-2); font-size: 13.5px; margin-top: 2px; }
.kpi .s { color: var(--text-3); font-size: 12.5px; margin-top: 6px; }

/* flags */
.flags { display: grid; gap: 8px; }
.flag { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.flag .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.flag.high { background: var(--danger-soft); border-color: transparent; } .flag.high .dot { background: var(--danger); }
.flag.mid { background: var(--warn-soft); border-color: transparent; } .flag.mid .dot { background: var(--warn); }
.flag.low .dot { background: var(--accent); }
.flag.ok { background: var(--ok-soft); border-color: transparent; } .flag.ok .dot { background: var(--ok); }
.flag b { display: block; }

/* heatmap */
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.heat .dow { text-align: center; font-size: 12px; color: var(--text-3); }
.cell { position: relative; min-height: 70px; border-radius: 10px; border: 1px solid var(--line); padding: 6px 7px; display: flex; flex-direction: column; justify-content: space-between; background: var(--surface); overflow: hidden; }
.cell .bg { position: absolute; inset: 0; background: var(--accent); }
.cell .pb { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--surface-2); }
.cell .pb i { display: block; height: 100%; background: var(--accent); }
.cell > * { position: relative; }
.cell .d { font-weight: 600; font-variant-numeric: tabular-nums; }
.cell .t { font-size: 11.5px; line-height: 1.2; }
.cell.off { border-style: dashed; background: transparent; color: var(--text-3); }
.cell.future { opacity: .55; }
.cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.lesson { border-left: 4px solid var(--turq); }
.cell.cp::after { content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; background: var(--turq); transform: rotate(45deg); }
.cell.missed { background: var(--danger-soft); border-color: transparent; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-top: 10px; align-items: center; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 12.5px; color: var(--text-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; padding-right: 14px; }
.pass { color: var(--ok); font-weight: 600; } .miss { color: var(--danger); font-weight: 600; } .pend { color: var(--text-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
details.essay summary { cursor: pointer; font-weight: 600; list-style: none; }
details.essay summary::-webkit-details-marker { display: none; }
details.essay .text { white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; margin: 8px 0 4px; font-size: 15px; line-height: 1.6; max-width: 80ch; }
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); position: relative; min-width: 80px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: var(--accent); }
.bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .7; }
svg text { fill: var(--text-2); font: 12px var(--f-text); }
svg .gl { stroke: var(--line); }
audio { height: 34px; max-width: 100%; }
.pm { display: inline-block; vertical-align: -1px; margin-right: 5px; }
.foot { margin-top: 44px; color: var(--text-3); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
.empty { color: var(--text-3); padding: 8px 0; }
@media print { .toggle { display: none !important; } body { background: #fff; } .mast { -webkit-print-color-adjust: exact; print-color-adjust: exact; } details.essay { break-inside: avoid; } section { break-inside: avoid-page; } }
</style>
</head>
<body>
<div id="root"></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = (x) => (x == null ? "–" : Number(x).toFixed(1));
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtD = (iso) => { const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return `${d} ${MON[m - 1]}`; };
const dayDiff = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
const hm = (min) => { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${m ? m + " min" : ""}`.trim() : `${m} min`; };
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const sum = (a) => a.reduce((x, y) => x + y, 0);
const SKILL = { listening: "Listening", reading: "Reading", writing: "Writing", speaking: "Speaking" };
const SKCOL = { listening: "var(--sk-listen)", reading: "var(--sk-read)", writing: "var(--sk-write)", speaking: "var(--sk-speak)" };
const PMARK = { Task: "M2 2h8v8H2z", Article: "M6 1.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z", Collocation: "M6 1.5l5 9H1z", Grammar: "M6 1l5 5-5 5-5-5z", Template: "M2 2l8 8M10 2l-8 8" };
const pmark = (p) => `<svg class="pm" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="color:var(--p-${p.toLowerCase()})"><path d="${PMARK[p]}" ${p === "Template" ? 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"' : 'fill="currentColor"'}/></svg>`;

const today = D.today;
const pastDays = D.days.filter((d) => d.date <= today);
const studyDays = D.days.filter((d) => d.type !== "off");

// ---------- derived numbers ----------
const items = D.days.flatMap((d) => d.items.map((i) => ({ ...i, date: d.date, type: d.type })));
const dueItems = items.filter((i) => i.date <= today && !i.lesson);
const doneItems = dueItems.filter((i) => i.done);
const dayStat = (d) => { const its = d.items; const done = its.filter((i) => i.done); return { total: its.length, done: done.length, planMin: sum(its.map((i) => i.minutes || 0)), doneMin: sum(done.map((i) => i.minutes || 0)), frac: its.length ? done.length / its.length : 0 }; };
const stats = D.days.map((d) => ({ d, ...dayStat(d) }));
const activeDay = (s) => s.done > 0 || s.d.minDone > 0 || (D.study[s.d.date] || 0) > 0;
const studiedMinutes = sum(D.days.map((d) => Math.max(D.study[d.date] || 0, dayStat(d).doneMin)));
const lateCount = items.filter((i) => i.done && i.late).length;
const completionPct = dueItems.length ? Math.round((100 * doneItems.length) / dueItems.length) : 0;
const lastActive = [...stats].reverse().find((s) => s.d.date <= today && activeDay(s));
const daysSince = lastActive ? dayDiff(lastActive.d.date, today) : null;

// ---------- flags ----------
function buildFlags() {
  const F = [];
  const now = Date.parse(D.generatedAt);
  const waiting = D.essays.filter((e) => e.band == null);
  if (waiting.length) {
    const oldest = Math.max(...waiting.map((e) => (now - Date.parse(e.createdAt)) / 36e5));
    F.push({ lvl: oldest > 24 ? "high" : "mid", t: `${waiting.length} essay${waiting.length > 1 ? "s" : ""} waiting for your marking`, s: `Rule 1: marked within 24 hours. The oldest was submitted ${oldest < 48 ? Math.round(oldest) + " hours" : Math.round(oldest / 24) + " days"} ago.` });
  }
  // two missed study days in a row
  let run = 0, maxRun = 0, runEnd = null;
  for (const s of stats) { if (s.d.date >= today || s.d.type === "off" || !s.total) { if (s.d.type !== "off" && s.d.date >= today) break; continue; } if (!activeDay(s)) { run++; if (run > maxRun) { maxRun = run; runEnd = s.d.date; } } else run = 0; }
  if (maxRun >= 2) F.push({ lvl: "high", t: `${maxRun} study days in a row with nothing done`, s: `Ending ${fmtD(runEnd)}. Ask what got in the way; rule 5 allows a 45-minute minimum day.` });
  if (daysSince != null && daysSince >= 2 && today >= D.planStart && today <= D.planEnd) F.push({ lvl: "mid", t: `No activity for ${daysSince} days`, s: `Last activity ${fmtD(lastActive.d.date)}.` });
  if (D.cards.leeches.length) F.push({ lvl: "mid", t: `${D.cards.leeches.length} review card${D.cards.leeches.length > 1 ? "s" : ""} she keeps missing`, s: D.cards.leeches.slice(0, 3).map((c) => `“${c.front}”`).join(", ") + ". Good lesson warm-up material." });
  const rep = D.errors.filter((e) => e.seen >= 3 && e.status !== "Fixed");
  if (rep.length) F.push({ lvl: "mid", t: `${rep.length} mistake${rep.length > 1 ? "s" : ""} seen three or more times`, s: rep.slice(0, 3).map((e) => `“${e.wrote}”`).join(", ") + "." });
  const minDays = D.minimumDays.length;
  if (minDays) F.push({ lvl: "low", t: `${minDays} minimum day${minDays > 1 ? "s" : ""} used`, s: D.minimumDays.map(fmtD).join(", ") + ". They still count for the streak." });
  if (lateCount >= 3) F.push({ lvl: "low", t: `${lateCount} tasks were finished a day or more late`, s: "Moved or caught up after the planned day." });
  const spkPlanned = items.filter((i) => i.date <= today && i.block === "speak" && !i.lesson).length, spkDone = items.filter((i) => i.date <= today && i.block === "speak" && i.done && !i.lesson).length;
  if (spkPlanned >= 2 && spkDone / spkPlanned < 0.5) F.push({ lvl: "mid", t: "Speaking is falling behind", s: `${spkDone} of ${spkPlanned} speaking tasks done so far. Speaking is the top priority.` });
  const unscoredSpk = D.est.assumed && today > D.planStart;
  if (unscoredSpk) F.push({ lvl: "low", t: "Speaking has no band yet", s: "The estimate assumes speaking equals writing until the Lesson 1 score is entered." });
  if (!F.length) F.push({ lvl: "ok", t: "Nothing needs attention", s: "On track against the plan." });
  const order = { high: 0, mid: 1, low: 2, ok: 3 }; return F.sort((a, b) => order[a.lvl] - order[b.lvl]);
}

// ---------- svg helpers ----------
const S = (n, a = {}, inner = "") => `<${n} ${Object.entries(a).map(([k, v]) => `${k}="${esc(v)}"`).join(" ")}>${inner}</${n}>`;
function lineChart(series, { W = 760, H = 250, yMin = 5, yMax = 9, aims = {} } = {}) {
  const L = 34, R = 14, T = 12, B = 28;
  const all = series.flatMap((s) => s.pts); if (!all.length) return `<div class="empty">No results yet.</div>`;
  const dates = all.map((p) => p.d).sort(); const d0 = D.planStart, d1 = D.planEnd; const span = Math.max(1, dayDiff(d0, d1));
  const x = (d) => L + (W - L - R) * Math.max(0, Math.min(1, dayDiff(d0, d) / span)), y = (v) => T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin));
  let out = "";
  for (let v = yMin; v <= yMax; v++) out += S("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: "gl" }) + S("text", { x: 4, y: y(v) + 4 }, v);
  out += S("text", { x: L, y: H - 8 }, fmtD(d0)) + S("text", { x: W - R, y: H - 8, "text-anchor": "end" }, fmtD(d1));
  const tx = D.today >= d0 && D.today <= d1 ? x(D.today) : null;
  if (tx != null) out += S("line", { x1: tx, x2: tx, y1: T, y2: H - B, stroke: "var(--text-3)", "stroke-dasharray": "3 4" }) + S("text", { x: tx, y: T + 10, "text-anchor": "middle" }, "today");
  for (const s of series) {
    if (aims[s.key] != null) out += S("line", { x1: L, x2: W - R, y1: y(aims[s.key]), y2: y(aims[s.key]), stroke: s.color, "stroke-dasharray": "2 5", opacity: .55 });
    if (!s.pts.length) continue;
    const pts = s.pts.slice().sort((a, b) => a.d.localeCompare(b.d));
    if (pts.length > 1) out += S("polyline", { points: pts.map((p) => `${x(p.d)},${y(p.v)}`).join(" "), fill: "none", stroke: s.color, "stroke-width": 2.5, "stroke-linejoin": "round" });
    for (const p of pts) out += S("circle", { cx: x(p.d), cy: y(p.v), r: 4.5, fill: s.color }, S("title", {}, `${s.name} ${p.v.toFixed(1)}, ${fmtD(p.d)}`));
  }
  const legend = series.filter((s) => s.pts.length).map((s) => `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><i style="width:18px;height:3px;background:${s.color};display:inline-block"></i>${esc(s.name)}${aims[s.key] != null ? ` <span class="faint">(aim ${aims[s.key]})</span>` : ""}</span>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Band scores over time">${out}</svg><div class="tiny muted" style="margin-top:6px">${legend}</div>`;
}
function barChart(rows, { W = 760, H = 190, color = "var(--accent)", marks = null, unit = "min" } = {}) {
  const L = 34, R = 8, T = 10, B = 26; if (!rows.length) return `<div class="empty">Nothing yet.</div>`;
  const max = Math.max(30, ...rows.map((r) => r.v), ...(marks ? rows.map((r) => r.m || 0) : [0])); const top = Math.ceil(max / 30) * 30; const bw = (W - L - R) / rows.length;
  let out = ""; for (const v of [0, top / 2, top]) { const yy = T + (H - T - B) * (1 - v / top); out += S("line", { x1: L, x2: W - R, y1: yy, y2: yy, class: "gl" }) + S("text", { x: 2, y: yy + 4 }, v); }
  rows.forEach((r, i) => { const hh = (H - T - B) * (r.v / top); const x0 = L + i * bw;
    out += S("rect", { x: x0 + 2, y: H - B - hh, width: Math.max(2, bw - 4), height: hh, rx: 3, fill: r.color || color }, S("title", {}, `${r.label}: ${r.v} ${unit}${r.m ? " of " + r.m + " planned" : ""}`));
    if (marks && r.m) { const my = T + (H - T - B) * (1 - r.m / top); out += S("line", { x1: x0 + 1, x2: x0 + bw - 1, y1: my, y2: my, stroke: "var(--text)", "stroke-width": 2, opacity: .55 }); }
    if (rows.length <= 31 && (i % Math.ceil(rows.length / 14) === 0)) out += S("text", { x: x0 + bw / 2, y: H - 8, "text-anchor": "middle" }, r.short || ""); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${out}</svg>`;
}
const hbar = (label, v, max, text, color = "var(--accent)") => `<div class="skillrow hb"><span>${label}</span><div class="track"><div class="fill" style="width:${max ? Math.min(100, (100 * v) / max) : 0}%;background:${color}"></div></div><span class="num tiny muted" style="text-align:right">${text}</span></div>`;

// ---------- sections ----------
function masthead() {
  const NS = "http://www.w3.org/2000/svg";
  const g = [[40, 4, "#2B4FD0", .55], [40, 2, "#1FB5AD", .6], [40, 0, "#F4F1E8", .7]].map(([c, n, fill, op]) => { let r = ""; for (let i = -n; i <= n; i++) { const w = (n - Math.abs(i)) * 2 + 1; r += `<rect x="${c - w * 4}" y="${c + i * 8 - 4}" width="${w * 8}" height="8" fill="${fill}" opacity="${op}"/>`; } return r; }).join("");
  const ikat = `<svg class="ikat" viewBox="0 0 400 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><filter id="ft"><feGaussianBlur stdDeviation="1.1"/></filter><pattern id="pt" width="80" height="80" patternUnits="userSpaceOnUse"><g filter="url(#ft)">${g}</g></pattern></defs><rect width="400" height="140" fill="url(#pt)"/></svg>`;
  const dayNo = Math.min(28, Math.max(0, dayDiff(D.planStart, today) + 1));
  return `<header class="mast">${ikat}<div class="in"><div><div class="brand">8.5</div><h1>Progress report${D.name ? ` for ${esc(D.name)}` : ""}</h1><div class="sub">IELTS Month 1, ${fmtD(D.planStart)} to ${fmtD(D.planEnd)}. Day ${dayNo} of 28.</div></div>
  <div class="right">Created ${new Date(D.generatedAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Tashkent" })} (Tashkent)<br><button class="toggle" id="theme" aria-label="Switch between light and dark">Light / dark</button></div></div></header>`;
}
function hero() {
  const e = D.est, aims = D.aims, base = D.baseline;
  const rows = ["listening", "reading", "writing", "speaking"].map((k) => {
    const v = e.skills[k], b = base[k], dlt = v != null && b != null ? v - b : null;
    const assumed = k === "speaking" && e.assumed;
    return `<div class="skillrow"><b>${SKILL[k]}</b><div class="track" role="img" aria-label="${SKILL[k]} ${f1(v)}, aim ${aims[k]}"><div class="fill" style="width:${(Math.min(9, v || 0) / 9) * 100}%;background:${SKCOL[k]};opacity:${assumed ? .45 : 1}"></div>${b != null ? `<div class="base" style="left:${(b / 9) * 100}%" title="Baseline ${f1(b)}"></div>` : ""}<div class="aim" style="left:${(aims[k] / 9) * 100}%" title="Aim ${aims[k]}"></div></div>
      <span class="num"><b>${f1(v)}</b> <span class="faint">/ ${aims[k]}</span>${dlt != null && dlt !== 0 ? ` <span class="delta ${dlt > 0 ? "up" : "down"}">${dlt > 0 ? "+" : ""}${dlt.toFixed(1)}</span>` : ""}</span></div>`;
  }).join("");
  return `<section style="margin-top:26px"><div class="card hero"><div><div class="tiny muted">Estimated overall${e.assumed ? " (speaking not scored yet)" : ""}</div><div class="bigband" id="big">${f1(e.overall)}</div><div class="gap">${e.gap === 0 ? "At band " + D.target : f1(e.gap) + " to band " + D.target}</div></div>
  <div><div class="tiny muted" style="margin-bottom:4px">Latest band per skill, against the aim. The thin marker is the aim; the grey tick is the baseline from the autumn mock.</div>${rows}
  ${e.assumed ? `<div class="tiny faint" style="margin-top:6px">Speaking is shown at the writing band until it is scored.</div>` : ""}</div></div></section>`;
}
function kpis() {
  const essays = D.essays.length, rec = D.recordings.length, reviews = D.reviewTotal;
  const kp = [
    [`${completionPct}%`, "Tasks done", `${doneItems.length} of ${dueItems.length} planned so far${lateCount ? `, ${lateCount} late` : ""}`],
    [hm(studiedMinutes), "Time studied", `across ${stats.filter((s) => s.d.date <= today && activeDay(s)).length} active days`],
    [String(D.streak), "Day streak", "Sundays and minimum days don't break it"],
    [String(essays), "Essays submitted", `${D.essays.filter((e) => e.band != null).length} scored, ${essays ? Math.round(sum(D.essays.map((e) => e.words)) / essays) : 0} words on average`],
    [String(rec), "Recordings kept", rec ? `${hm(sum(D.recordings.map((r) => r.seconds)) / 60)} of speech` : "none yet"],
    [String(reviews), "Cards reviewed", `${D.cards.started} of ${D.cards.total} cards started`],
    [String(D.reading.length), "Reading logs", D.reading.length ? `latest ${D.reading.at(-1).raw}/${D.reading.at(-1).total}` : "none yet"],
    [String(D.errors.filter((e) => e.status === "Open").length), "Open mistakes", `${D.errors.filter((e) => e.status === "Fixed").length} fixed`],
  ];
  return `<section><div class="grid g4">${kp.map(([v, l, s]) => `<div class="card kpi"><div class="v num">${v}</div><div class="l">${l}</div><div class="s">${s}</div></div>`).join("")}</div></section>`;
}
function flagsSection() {
  return `<section><div class="sechead"><h2>Needs your attention</h2><span class="tiny muted">Worked out from the data below</span></div><div class="flags">${buildFlags().map((f) => `<div class="flag ${f.lvl}"><span class="dot"></span><div><b>${esc(f.t)}</b><span class="muted">${esc(f.s)}</span></div></div>`).join("")}</div></section>`;
}
function calendar() {
  const first = D.days[0]; const lead = (new Date(first.date + "T12:00:00Z").getUTCDay() + 6) % 7;
  let cells = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="dow">${d}</div>`).join("") + "<div></div>".repeat(lead);
  for (const s of stats) {
    const d = s.d, future = d.date > today, off = d.type === "off";
    const missed = !future && !off && d.date < today && s.total && !activeDay(s);
    const label = d.lessonNo ? `L${d.lessonNo}` : { self: "Study", test: "Test", fullmock: "Mock", light: "Light", off: "Rest" }[d.type] || "";
    const frac = off ? 0 : s.frac; const min = D.study[d.date] || 0;
    const txt = off ? "" : future ? `${s.total} planned` : `${s.done}/${s.total} done${min ? `, ${min} min` : ""}`;
    cells += `<div class="cell ${off ? "off" : ""} ${future ? "future" : ""} ${d.date === today ? "today" : ""} ${d.lessonNo ? "lesson" : ""} ${d.checkpoint ? "cp" : ""} ${missed ? "missed" : ""}" title="${esc(fmtD(d.date) + ": " + d.title + ". " + txt)}">
      <div class="bg" style="opacity:${future || off ? 0 : (0.04 + frac * 0.2).toFixed(2)}"></div>${future || off ? "" : `<div class="pb"><i style="width:${Math.round(frac * 100)}%"></i></div>`}<div class="d">${Number(d.date.slice(8))}</div><div class="t"><b>${label}</b><br><span class="lg">${esc(txt)}</span><span class="sm">${off ? "" : future ? s.total : `${s.done}/${s.total}`}</span></div></div>`;
  }
  return `<section><div class="sechead"><h2>The month, day by day</h2><span class="tiny muted">Colour is the share of the day's tasks done</span></div><div class="heat">${cells}</div>
  <div class="legend"><span><i style="background:var(--accent)"></i>Bar = share of tasks done</span><span><i style="background:var(--danger-soft)"></i>Nothing done</span><span><i style="border-left:4px solid var(--turq)"></i>Lesson day</span><span><i style="background:var(--turq);transform:rotate(45deg);width:9px;height:9px;border:0"></i> Checkpoint</span></div></section>`;
}
function effort() {
  const blocks = [["lesson", "Lessons"], ["speak", "Speaking"], ["write", "Writing"], ["read", "Reading"], ["fix", "Fix"], ["homework", "Homework"], ["listen", "Listening"]];
  const rows = blocks.map(([k, l]) => { const p = dueItems.filter((i) => i.block === k); const q = items.filter((i) => i.date <= today && i.block === k && i.lesson); const all = k === "lesson" ? q : p; const done = all.filter((i) => i.done);
    return all.length ? hbar(l, done.length, all.length, `${done.length} of ${all.length}, ${hm(sum(done.map((i) => i.minutes || 0)))}`, k === "lesson" ? "var(--text-3)" : SKCOL[{ speak: "speaking", write: "writing", read: "reading", listen: "listening" }[k]] || "var(--accent)") : ""; }).join("");
  const mins = pastDays.filter((d) => d.type !== "off").map((d) => { const st = dayDiff(D.planStart, d.date); return { label: fmtD(d.date), short: fmtD(d.date), v: Math.max(D.study[d.date] || 0, dayStat(d).doneMin), m: dayStat(d).planMin }; });
  return `<section><div class="sechead"><h2>Effort</h2><span class="tiny muted">Planned against done, up to today</span></div><div class="grid g2"><div class="card"><h3 style="margin-top:0">Tasks done by block</h3>${rows || '<div class="empty">Nothing planned yet.</div>'}</div>
  <div class="card"><h3 style="margin-top:0">Minutes per study day</h3>${barChart(mins, { marks: true })}<div class="tiny muted">Bars are minutes studied; the line is the planned minutes for that day.</div></div></div></section>`;
}
function scoresSection() {
  const aims = D.aims;
  const pts = (k) => D.scores.filter((s) => s.skill === k && (s.band != null)).map((s) => ({ d: s.date, v: s.band }));
  const rd = D.scores.filter((s) => s.skill === "reading" && s.band != null).map((s) => ({ d: s.date, v: s.band }));
  const ser = [{ key: "reading", name: "Reading", color: SKCOL.reading, pts: pts("reading") }, { key: "listening", name: "Listening", color: SKCOL.listening, pts: pts("listening") },
    { key: "writing", name: "Writing", color: SKCOL.writing, pts: D.writingSeries }, { key: "speaking", name: "Speaking", color: SKCOL.speaking, pts: pts("speaking") }];
  const names = { listening: "Listening", reading: "Reading", writing1: "Writing Task 1", writing2: "Writing Task 2", speaking: "Speaking" };
  const rows = D.scores.slice().sort((a, b) => b.date.localeCompare(a.date)).map((s) => `<tr><td>${fmtD(s.date)}</td><td>${names[s.skill]}</td><td class="n">${s.raw != null ? s.raw + "/40" : "–"}</td><td class="n"><b>${f1(s.band)}</b></td><td class="muted">${esc(s.note || "")}${s.baseline ? " (baseline)" : ""}</td></tr>`).join("");
  return `<section><div class="sechead"><h2>Band scores</h2><span class="tiny muted">Dashed lines are the aims: 9, 9, 8, 8 for an overall 8.5</span></div><div class="card">${lineChart(ser, { aims })}</div>
  <div class="card" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Skill</th><th class="n">Raw</th><th class="n">Band</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function checkpoints() {
  return `<section><div class="sechead"><h2>Checkpoints</h2><span class="tiny muted">Targets from the plan</span></div><div class="grid g2">${D.checkpoints.map((c) => `<div class="card"><h3 style="margin-top:0">${esc(c.name)}, ${esc(c.dates)}</h3><table><thead><tr><th>Skill</th><th>Target</th><th>Result</th><th></th></tr></thead><tbody>${c.rows.map((r) => `<tr><td>${r.skill}</td><td>${esc(r.target)}</td><td class="num">${esc(r.result)}</td><td class="${r.pass == null ? "pend" : r.pass ? "pass" : "miss"}">${r.pass == null ? "Not yet" : r.pass ? "Passed" : "Missed"}</td></tr>`).join("")}</tbody></table></div>`).join("")}</div></section>`;
}
function writing() {
  const rows = D.essays.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map((e) => {
    const goal = e.part === 1 ? 150 : 250, kind = e.part === 1 ? "Task 1" : `Task 2${e.promptId ? ", " + e.promptId : ""}`;
    const mins = e.minutes ? `${Math.round(e.seconds / 60)} of ${e.minutes} min` : `${Math.round(e.seconds / 60)} min, untimed`;
    const age = (Date.parse(D.generatedAt) - Date.parse(e.createdAt)) / 36e5;
    return `<tr><td>${fmtD(e.createdAt)}</td><td><details class="essay"><summary>${kind}${e.rewrite ? ' <span class="pill acc">rewrite</span>' : ""}</summary><div class="tiny muted" style="margin-top:6px">${esc(e.promptText)}</div>${e.plan ? `<div class="tiny" style="margin-top:6px"><b>Her plan:</b> ${esc(e.plan)}</div>` : e.skipPlan ? `<div class="tiny" style="margin-top:6px"><b>Skipped the plan:</b> ${esc(e.skipPlan)}</div>` : ""}<div class="text">${esc(e.text)}</div></details></td>
      <td class="n"><div>${e.words}</div><div class="bar"><i style="width:${Math.min(100, (100 * e.words) / (goal * 1.4))}%"></i><b style="left:${(100 * goal) / (goal * 1.4)}%"></b></div></td><td class="n">${mins}</td>
      <td class="n">${e.band != null ? `<b>${f1(e.band)}</b>` : `<span class="pill ${age > 24 ? "warn" : ""}">${age > 24 ? "Waiting " + Math.round(age) + " h" : "Not marked"}</span>`}</td><td class="n tiny muted">${e.checksTotal ? `${e.checksDone}/${e.checksTotal} self-checks` : ""}</td></tr>`;
  }).join("");
  const t2 = D.essays.filter((e) => e.part === 2), t1 = D.essays.filter((e) => e.part === 1);
  return `<section><div class="sechead"><h2>Writing</h2><span class="tiny muted">${t1.length} Task 1, ${t2.length} Task 2. Open an essay to read it. The marker is the 150 / 250 word minimum.</span></div>
  ${D.essays.length ? `<div class="card"><table><thead><tr><th>Date</th><th>Essay</th><th class="n">Words</th><th class="n">Time</th><th class="n">Band</th><th class="n"></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="card empty">No essays submitted yet.</div>`}</section>`;
}
function speaking() {
  const recs = D.recordings.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const byDay = {}; for (const r of D.recordings) byDay[r.date] = (byDay[r.date] || 0) + r.seconds / 60;
  const chart = pastDays.filter((d) => d.type !== "off").map((d) => ({ label: fmtD(d.date), short: fmtD(d.date), v: Math.round((byDay[d.date] || 0) * 10) / 10, color: "var(--sk-speak)" }));
  const parts = [1, 2, 3].map((p) => `${D.recordings.filter((r) => r.part === p).length} Part ${p}`).join(", ");
  const list = recs.slice(0, 60).map((r) => `<tr><td>${fmtD(r.date)}</td><td>${r.mode === "baseline" ? "Lesson 1 baseline" : "Part " + r.part}${r.lessonNo ? ` <span class="pill">Lesson ${r.lessonNo}</span>` : ""}</td><td>${esc(r.prompt)}</td><td class="n">${mmss(r.seconds)}</td><td class="n">${r.attempts || 1}</td><td>${r.audio ? `<audio controls preload="none" src="${r.audio}"></audio>` : '<span class="tiny faint">audio not included</span>'}</td></tr>`).join("");
  return `<section><div class="sechead"><h2>Speaking</h2><span class="tiny muted">${D.recordings.length} recordings kept: ${parts}</span></div>
  <div class="grid g2"><div class="card"><h3 style="margin-top:0">Minutes of speech recorded per day</h3>${barChart(chart, { color: "var(--sk-speak)", unit: "min" })}</div>
  <div class="card"><h3 style="margin-top:0">Recorded against planned</h3>${(() => { const p = items.filter((i) => i.date <= today && i.block === "speak" && !i.lesson), dn = p.filter((i) => i.done); return hbar("Speaking tasks", dn.length, p.length || 1, `${dn.length} of ${p.length}`, "var(--sk-speak)"); })()}
  <div class="tiny muted" style="margin-top:10px">Pronunciation is never scored by the app. Give the four criteria bands after listening, then she enters them under Progress.</div></div></div>
  ${recs.length ? `<div class="card" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Type</th><th>Prompt</th><th class="n">Length</th><th class="n">Attempts</th><th>Listen</th></tr></thead><tbody>${list}</tbody></table></div>` : ""}</section>`;
}
function reading() {
  const rows = D.reading.slice().sort((a, b) => b.date.localeCompare(a.date));
  const causeNames = { paraphrase: "Missed paraphrase", fvng: "False vs Not Given", time: "Ran out of time", careless: "Careless", vocab: "Vocabulary" };
  const causes = Object.fromEntries(Object.keys(causeNames).map((k) => [k, sum(D.reading.map((r) => r.causes?.[k] || 0))])); const cmax = Math.max(1, ...Object.values(causes));
  const byType = {}; for (const r of D.reading) { (byType[r.type] ||= []).push(r); }
  return `<section><div class="sechead"><h2>Reading</h2><span class="tiny muted">${D.reading.length} passages or tests logged</span></div>
  ${D.reading.length ? `<div class="grid g2"><div class="card"><h3 style="margin-top:0">Why marks were lost</h3>${Object.entries(causes).map(([k, v]) => hbar(causeNames[k], v, cmax, String(v), "var(--sk-read)")).join("")}<div class="tiny muted" style="margin-top:6px">This picks the topic for the reading clinic.</div></div>
  <div class="card"><h3 style="margin-top:0">Question types logged</h3>${Object.entries(byType).map(([t, a]) => hbar(esc(t), sum(a.map((x) => x.total - x.raw)), Math.max(...Object.values(byType).map((b) => sum(b.map((x) => x.total - x.raw)))) || 1, `${sum(a.map((x) => x.total - x.raw))} lost in ${a.length}`, "var(--sk-read)")).join("")}</div></div>
  <div class="card" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Source</th><th>Question type</th><th class="n">Score</th><th class="n">Time</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${fmtD(r.date)}</td><td>${esc(r.source)}</td><td>${esc(r.type)}</td><td class="n"><b>${r.raw}/${r.total}</b></td><td class="n">${r.minutesUsed} min</td></tr>`).join("")}</tbody></table></div>` : `<div class="card empty">Nothing logged yet.</div>`}</section>`;
}
function review() {
  const days = Object.keys(D.reviews).sort(); const rows = days.map((d) => ({ label: fmtD(d), short: fmtD(d), v: D.reviews[d].n, color: "var(--accent)" }));
  const tot = D.reviewTotal; const r = { again: 0, hard: 0, good: 0, easy: 0 }; for (const d of days) for (const k of Object.keys(r)) r[k] += D.reviews[d][k] || 0;
  const recall = tot ? Math.round((100 * (r.good + r.easy + r.hard)) / tot) : 0;
  return `<section><div class="sechead"><h2>Review</h2><span class="tiny muted">${D.cards.started} of ${D.cards.total} cards started, ${D.cards.due} due now</span></div>
  <div class="grid g2"><div class="card"><h3 style="margin-top:0">Cards reviewed per day</h3>${rows.length ? barChart(rows, { unit: "cards" }) : '<div class="empty">No reviews yet.</div>'}</div>
  <div class="card"><h3 style="margin-top:0">How reviews went</h3>${tot ? [["Again", r.again, "var(--danger)"], ["Hard", r.hard, "var(--warn)"], ["Good", r.good, "var(--accent)"], ["Easy", r.easy, "var(--ok)"]].map(([l, v, c]) => hbar(l, v, tot, `${v} (${Math.round((100 * v) / tot)}%)`, c)).join("") + `<div class="tiny muted" style="margin-top:8px">Remembered ${recall}% of the time (Hard, Good or Easy).</div>` : '<div class="empty">No reviews yet.</div>'}
  ${D.cards.leeches.length ? `<h3>Cards she keeps missing</h3><ul style="margin:0;padding-left:18px">${D.cards.leeches.map((c) => `<li>${esc(c.front)} <span class="faint tiny">(failed ${c.lapses} times)</span></li>`).join("")}</ul>` : ""}</div></div></section>`;
}
function errors() {
  const pats = ["Task", "Article", "Collocation", "Grammar", "Template"];
  const by = pats.map((p) => ({ p, open: D.errors.filter((e) => e.pattern === p && e.status !== "Fixed").length, fixed: D.errors.filter((e) => e.pattern === p && e.status === "Fixed").length }));
  const tot = Math.max(1, ...by.map((x) => x.open + x.fixed));
  const rows = by.map((x) => `<div class="skillrow hb"><span>${pmark(x.p)}${x.p}</span><div class="track" style="display:flex;overflow:hidden"><div style="width:${(100 * x.fixed) / tot}%;background:var(--ok)"></div><div style="width:${(100 * x.open) / tot}%;background:var(--p-${x.p.toLowerCase()})"></div></div><span class="num tiny muted" style="text-align:right">${x.open} open, ${x.fixed} fixed</span></div>`).join("");
  const top = D.errors.filter((e) => e.status !== "Fixed").sort((a, b) => b.seen - a.seen).slice(0, 10);
  const mine = D.errors.filter((e) => !e.fromPlan).sort((a, b) => (b.firstSeen || "").localeCompare(a.firstSeen || ""));
  return `<section><div class="sechead"><h2>Error log</h2><span class="tiny muted">${D.errors.length} mistakes, ${D.errors.filter((e) => e.status === "Fixed").length} fixed</span></div>
  <div class="grid g2"><div class="card"><h3 style="margin-top:0">By pattern</h3>${rows}<div class="tiny muted" style="margin-top:8px">Green is fixed. A mistake is fixed after three correct reviews over at least seven days, or when you mark it.</div></div>
  <div class="card"><h3 style="margin-top:0">Top recurring, still open</h3><table><tbody>${top.map((e) => `<tr><td>${pmark(e.pattern)}</td><td><div>${esc(e.wrote)}</div><div class="tiny muted">${esc(e.correct)}</div></td><td class="n"><b>${e.seen}</b><div class="tiny faint">times</div></td></tr>`).join("")}</tbody></table></div></div>
  ${mine.length ? `<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Mistakes she added herself (${mine.length})</h3><table><tbody>${mine.slice(0, 25).map((e) => `<tr><td>${pmark(e.pattern)}</td><td>${esc(e.wrote)}</td><td class="muted">${esc(e.correct)}</td><td class="n tiny faint">${esc(e.source)}${e.seen > 1 ? `, seen ${e.seen}` : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}</section>`;
}

function render() {
  $("#root").innerHTML = masthead() + `<div class="wrap">` + hero() + kpis() + flagsSection() + calendar() + effort() + scoresSection() + checkpoints() + writing() + speaking() + reading() + review() + errors() +
    `<div class="foot">Made on her device by 8.5 and shared by her. It contains her essays${D.recordings.some((r) => r.audio) ? ", recordings" : ""} and scores, so please keep it private. Open it in any browser; nothing is sent anywhere.</div></div>`;
  $("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; };
}
render();
</script>
</body>
